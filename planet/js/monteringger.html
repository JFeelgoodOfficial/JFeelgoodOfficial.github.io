<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Hike 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: crosshair;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        canvas {
            display: block;
        }
        
        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Stamina Bar */
        #stamina-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        
        #stamina-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4444 0%, #ffaa00 50%, #44ff44 100%);
            border-radius: 10px;
            transition: width 0.1s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        
        #stamina-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }
        
        /* Stats Panel */
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px 20px;
            color: white;
            font-size: 14px;
            min-width: 200px;
        }
        
        #stats-panel .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        #stats-panel .stat-row:last-child {
            margin-bottom: 0;
        }
        
        #stats-panel .stat-label {
            color: #aaa;
        }
        
        #stats-panel .stat-value {
            font-weight: bold;
            color: #fff;
        }
        
        /* Zone Indicator */
        #zone-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            opacity: 0.9;
        }
        
        /* Exertion Vignette */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 0 0 rgba(139, 0, 0, 0);
            transition: box-shadow 0.3s ease;
            pointer-events: none;
        }
        
        /* Controls Hint */
        #controls-hint {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-align: center;
            line-height: 1.6;
        }
        
        /* Summit Overlay */
        #summit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            z-index: 100;
        }
        
        #summit-overlay.active {
            display: flex;
        }
        
        #summit-overlay h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: summitGlow 2s ease-in-out infinite;
        }
        
        @keyframes summitGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.4); }
        }
        
        #summit-stats {
            color: white;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 2;
        }
        
        #summit-stats .big-stat {
            font-size: 32px;
            color: #ffd700;
            font-weight: bold;
        }
        
        #hike-again-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        #hike-again-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }
        
        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 1s ease;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        #loading-title {
            color: #ffd700;
            font-size: 36px;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        
        #loading-bar-container {
            width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        #loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        #loading-text {
            color: rgba(255,255,255,0.6);
            margin-top: 15px;
            font-size: 14px;
        }
        
        /* Breathing indicator */
        #breathing-indicator {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 100, 100, 0);
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.5s, color 0.5s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">
            <div id="loading-title">🏔️ MOUNTAIN HIKE 3D</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-text">Generating terrain...</div>
        </div>
        
        <div id="hud">
            <div id="zone-indicator">FOREST ZONE</div>
            
            <div id="stats-panel">
                <div class="stat-row">
                    <span class="stat-label">Elevation</span>
                    <span class="stat-value" id="elevation-display">0 m</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Distance to Summit</span>
                    <span class="stat-value" id="distance-display">--</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Time</span>
                    <span class="stat-value" id="time-display">00:00</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Slope</span>
                    <span class="stat-value" id="slope-display">0°</span>
                </div>
            </div>
            
            <div id="vignette"></div>
            
            <div id="stamina-container">
                <div id="stamina-bar"></div>
                <div id="stamina-label">STAMINA</div>
            </div>
            
            <div id="breathing-indicator">HEAVY BREATHING</div>
            
            <div id="controls-hint">
                WASD / Arrows to move • Shift to catch breath • Space to jump
            </div>
        </div>
        
        <div id="summit-overlay">
            <h1>🏔️ SUMMIT REACHED!</h1>
            <div id="summit-stats">
                <div>Total Elevation Climbed</div>
                <div class="big-stat" id="summit-elevation">0 m</div>
                <div>Time Taken</div>
                <div class="big-stat" id="summit-time">00:00</div>
            </div>
            <button id="hike-again-btn">🥾 Hike Again</button>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
